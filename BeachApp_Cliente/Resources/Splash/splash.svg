<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="beachGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00B4DB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0083B0;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Fundo gradiente -->
    <rect x="0" y="0" width="456" height="456" fill="url(#beachGradient)" />
    
    <!-- Sol -->
    <circle cx="380" cy="76" r="35" fill="#FFD700" opacity="0.9" />
    
    <!-- Guarda-sol grande central -->
    <ellipse cx="228" cy="180" rx="100" ry="30" fill="#FF6B6B" opacity="0.9" />
    <ellipse cx="228" cy="170" rx="95" ry="25" fill="#FF5252" />
    <line x1="228" y1="180" x2="228" y2="340" stroke="#8D6E63" stroke-width="12" />
    
    <!-- Texto Quiosque -->
    <text x="228" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white" opacity="0.95">🏖️</text>
    <text x="228" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white" opacity="0.9">QUIOSQUE</text>
    <text x="228" y="345" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" opacity="0.8">da Praia</text>
    
    <!-- Ondas decorativas -->
    <path d="M 50 380 Q 100 360 150 380 T 250 380 T 350 380 T 400 380" stroke="white" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M 20 400 Q 70 380 120 400 T 220 400 T 320 400 T 420 400" stroke="white" stroke-width="2" fill="none" opacity="0.5" />
</svg>
