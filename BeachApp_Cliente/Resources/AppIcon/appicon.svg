    <!-- Ondas -->
    <path d="M 50 350 Q 100 330 150 350 T 250 350 T 350 350 T 400 350" stroke="white" stroke-width="4" fill="none" opacity="0.8" />
    <path d="M 20 370 Q 70 350 120 370 T 220 370 T 320 370 T 420 370" stroke="white" stroke-width="3" fill="none" opacity="0.6" />
    
    <!-- Mesa/tábua -->
