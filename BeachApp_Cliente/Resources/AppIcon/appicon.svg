            <stop offset="0%" style="stop-color:#00B4DB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0083B0;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#beachGradient)" rx="80" />
    
    <!-- Sol -->
    <circle cx="350" cy="106" r="45" fill="#FFD700" />
    
    <!-- Guarda-sol -->
    <ellipse cx="228" cy="200" rx="80" ry="25" fill="#FF6B6B" />
